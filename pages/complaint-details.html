<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Complaint Details | CivicConnect</title>

    <!-- Bootstrap -->

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Project CSS -->

    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>

  <body class="inner-page complaint-details-page">
    <!-- Toast Container -->

    <div
      class="toast-container position-fixed top-0 end-0 p-4"
      id="toastContainer"
    ></div>

    <section class="about-section">
      <div class="container">
        <a href="complaints.html" class="dashboard-btn mb-4">
          ← Back To Dashboard
        </a>
        <button type="button" class="dashboard-btn mb-4 ms-2" id="logoutBtn">
          Logout
        </button>
        <div class="about-card" id="complaintDetailsCard">
          <div class="text-center py-5">
            <div class="spinner-border text-info" role="status">
              <span class="visually-hidden"> Loading... </span>
            </div>

            <p class="mt-3">Loading complaint...</p>
          </div>
        </div>
      </div>
    </section>

    <!-- jQuery -->

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Firebase -->

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
    <script src="../assets/js/firebase.js"></script>

    <!-- Shared UI -->

    <script src="../assets/js/ui.js"></script>
    <!-- Shared Utilities -->

    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/auth.js"></script>

    <script>
      $(document).ready(function () {
        civicAuth.requireLogin();
      });
    </script>

    <!-- Complaint Details Logic -->

    <script src="../assets/js/complaint-details.js"></script>
  </body>
</html>
