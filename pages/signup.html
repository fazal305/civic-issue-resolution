<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sign Up | CivicConnect</title>

    <!-- Bootstrap CSS -->

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- External CSS -->

    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>

  <body class="inner-page auth-page">
    <div id="pageLoader">
      <div class="loader-content">
        <div class="loader-logo">🏛️</div>

        <h2>CivicConnect</h2>

        <p>Connecting Citizens with Civic Services...</p>

        <div class="loader-spinner"></div>
      </div>
    </div>
    <!-- Toast Container -->

    <div
      class="toast-container position-fixed top-0 end-0 p-4"
      id="toastContainer"
    ></div>

    <!-- Signup Section -->

    <section class="about-section reveal-section">
      <div class="container">
        <a href="../index.html" class="dashboard-btn mb-4"> ← Back To Home </a>

        <div class="row justify-content-center">
          <div class="col-lg-6 col-md-9">
            <div class="about-card auth-card">
              <p class="section-label">CREATE ACCOUNT</p>

              <h1 class="section-title">Join CivicConnect</h1>

              <p class="about-text">
                Create your citizen account to submit complaints, save records,
                and track civic issue progress.
              </p>

              <form id="signupForm">
                <div class="mb-4">
                  <label class="form-label" for="signupName"> Full Name </label>

                  <input
                    type="text"
                    id="signupName"
                    class="form-control"
                    placeholder="Enter your full name"
                  />
                </div>

                <div class="mb-4">
                  <label class="form-label" for="signupEmail">
                    Email Address
                  </label>

                  <input
                    type="email"
                    id="signupEmail"
                    class="form-control"
                    placeholder="Enter your email"
                  />
                </div>

                <div class="mb-4">
                  <label class="form-label" for="signupPassword">
                    Password
                  </label>

                  <input
                    type="password"
                    id="signupPassword"
                    class="form-control"
                    placeholder="Create a password"
                  />
                </div>

                <button type="submit" class="hero-btn w-100" id="signupBtn">
                  Create Account
                </button>
              </form>

              <p class="about-text text-center mt-4 mb-0">
                Already have an account?

                <a href="login.html" class="footer-link"> Login here </a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- jQuery -->

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Firebase -->

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

    <script src="../assets/js/firebase.js"></script>
    <script src="../assets/js/loader.js"></script>
    <!-- Shared UI -->

    <script src="../assets/js/ui.js"></script>

    <!-- Shared Auth -->

    <script src="../assets/js/auth.js"></script>

    <!-- Signup Logic -->

    <script src="../assets/js/signup.js"></script>
  </body>
</html>
