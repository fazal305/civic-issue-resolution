<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login | CivicConnect</title>

    <!-- Bootstrap CSS -->

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- External CSS -->

    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>

  <body class="inner-page auth-page">
    <!-- Toast Container -->

    <div
      class="toast-container position-fixed top-0 end-0 p-4"
      id="toastContainer"
    ></div>

    <!-- Login Section -->

    <section class="about-section reveal-section">
      <div class="container">
        <a href="../index.html" class="dashboard-btn mb-4"> ← Back To Home </a>

        <div class="row justify-content-center">
          <div class="col-lg-6 col-md-9">
            <div class="about-card auth-card">
              <p class="section-label">CIVICCONNECT LOGIN</p>

              <h1 class="section-title">Welcome Back</h1>

              <p class="about-text">
                Login to access your saved civic complaints and continue
                tracking local issues.
              </p>

              <form id="loginForm">
                <div class="mb-4">
                  <label class="form-label" for="loginEmail">
                    Email Address
                  </label>

                  <input
                    type="email"
                    id="loginEmail"
                    class="form-control"
                    placeholder="Enter your email"
                  />
                </div>

                <div class="mb-4">
                  <label class="form-label" for="loginPassword">
                    Password
                  </label>

                  <input
                    type="password"
                    id="loginPassword"
                    class="form-control"
                    placeholder="Enter your password"
                  />
                </div>

                <button type="submit" class="hero-btn w-100" id="loginBtn">
                  Login
                </button>
              </form>

              <p class="about-text text-center mt-4 mb-0">
                Don't have an account?

                <a href="signup.html" class="footer-link"> Create one </a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- jQuery -->

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Firebase -->

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

    <script src="../assets/js/firebase.js"></script>

    <!-- Shared UI -->

    <script src="../assets/js/ui.js"></script>

    <!-- Shared Auth -->

    <script src="../assets/js/auth.js"></script>

    <!-- Login Logic -->

    <script src="../assets/js/login.js"></script>
  </body>
</html>
