<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>404 - Page Not Found | CivicConnect</title>
    <meta property="og:title" content="404 | CivicConnect" />

    <meta
      property="og:description"
      content="The page you requested could not be found."
    />

    <meta property="og:type" content="website" />
    <meta
      name="description"
      content="The CivicConnect page you are looking for could not be found."
    />
    <link rel="icon" type="image/png" href="assets/images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body>
    <section class="hero-section hero-error-section d-flex align-items-center">
      <div class="container text-center">
        <div class="about-card mx-auto error-card">
          <div style="font-size: 4rem; margin-bottom: 1rem" aria-hidden="true">
            <img
              src="assets/images/logo-icon.png"
              alt="CivicConnect"
              class="error-logo"
            />
          </div>
          <h1 class="hero-title display-1" tabindex="-1">404</h1>
          <p class="section-label">PAGE NOT FOUND</p>

          <h1 class="hero-title display-1">404</h1>

          <p class="hero-description mx-auto error-description">
            The page you're looking for doesn't exist, may have been moved, or
            the link is incorrect.
          </p>

          <p class="about-text mt-3">
            Returning to the homepage in
            <strong id="redirectCountdown">8</strong>
            seconds...
          </p>

          <div class="d-flex justify-content-center gap-3 flex-wrap mt-4">
            <a href="index.html" class="hero-btn">Return Home</a>

            <a href="pages/report.html" class="dashboard-btn">
              Report an Issue
            </a>
          </div>
        </div>
      </div>
    </section>

    <script>
      let secondsRemaining = 8;

      let countdownElement = document.getElementById("redirectCountdown");

      let countdownTimer = setInterval(function () {
        secondsRemaining--;

        countdownElement.textContent = secondsRemaining;

        if (secondsRemaining <= 0) {
          clearInterval(countdownTimer);

          window.location.replace("index.html");
        }
      }, 1000);
    </script>
  </body>
</html>
